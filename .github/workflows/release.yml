name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    # TESTING krypsis-io/.github#80 -- revert to @main once that PR lands.
    uses: krypsis-io/.github/.github/workflows/release-please.yml@ci/release-please-workflow
    with:
      release-type: go
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  container-build:
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    uses: krypsis-io/.github/.github/workflows/container-build.yml@main
    with:
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
